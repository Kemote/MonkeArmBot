# Extension configuration file.
# Visit the "Extension configuration file (extension.toml)" section for more details:
# https://docs.omniverse.nvidia.com/kit/docs/kit-manual/latest/guide/extensions_advanced.html
#

[core]
reloadable = true
order = 0

[package]
version = "0.1.0"
title = "MonkeArBot Controler"
description = "this extensions is used to handle communication between MonkeArmBot  and IsaacSim"
authors = ["Tomasz Szymski"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"omni.kit.uiapp" = {}

# define the Python module that the extension provides
[[python.module]]
name = "monke.armbot.controller"

# define the Python module for tests
[[python.module]]
name = "monke.armbot.controller.tests"

[settings]
exts."monke.armbot.controller".timeout = 5

# disable startup test
[[test]]
name = "startup"
enabled = false

[[test]]
enabled = true
dependencies = [
    "omni.kit.test",
]
